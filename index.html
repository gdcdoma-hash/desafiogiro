<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Desafio Giro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container {
      width: min(88vw, 440px);
      text-align: center;
    }
    .logo {
      width: min(82vw, 340px);
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }
    .texto {
      margin: 0 auto 12px;
      max-width: 390px;
      font-size: 15px;
      line-height: 1.5;
      color: #e5e5e5;
    }
    .apoio {
      margin-top: 20px;
      color: #ffb400;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="container">
    <img class="logo" src="logo-desafio-giro.png" alt="Desafio Giro">
    <h1>Portal em atualização</h1>
    <p class="texto">Estamos concluindo uma atualização do sistema. Durante este período, inscrições e registros ficam temporariamente indisponíveis.</p>
    <p class="texto">Tente novamente em alguns minutos.</p>
    <p class="apoio">Paixão por pedalar</p>
  </main>
</body>
</html>
