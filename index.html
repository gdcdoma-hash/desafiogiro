<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Desafio Giro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(88vw, 420px);
      text-align: center;
    }

    .logo {
      width: min(82vw, 360px);
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }

    .texto {
      margin: 0 0 16px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .barra {
      width: 100%;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #292929;
    }

    .progresso {
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #ffb400;
      animation: carregar 0.9s ease-in-out infinite;
    }

    .apoio {
      margin-top: 14px;
      color: #a7a7a7;
      font-size: 12px;
    }

    @keyframes carregar {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(330%);
      }
    }
  </style>

  <script>
    const destino =
      "https://script.google.com/macros/s/AKfycby5Z_ogTZ9HtpXU66RyClIAPZn7LD1njpMWg0xLfdkMzOB01wLk70wN6HHime6J1eQHmA/exec";

    window.addEventListener("DOMContentLoaded", () => {
      const parametros = window.location.search;

      setTimeout(() => {
        window.location.replace(destino + parametros);
      }, 900);
    });
  </script>
</head>

<body>
  <main class="container">
    <img
      class="logo"
      src="logo-desafio-giro.png"
      alt="Desafio Giro"
    >

    <p class="texto">Acessando o portal oficial...</p>

    <div class="barra" aria-label="Carregando">
      <div class="progresso"></div>
    </div>

    <p class="apoio">Paixão por pedalar</p>
  </main>
</body>
</html>
