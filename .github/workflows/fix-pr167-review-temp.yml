name: Fix PR167 review temp

on:
  push:
    branches:
      - feat/admin-desafios-fluxo-persistente
    paths:
      - '.github/workflows/fix-pr167-review-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-desafios-fluxo-persistente
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('platform/apps/admin-web/src/ChallengesPanel.tsx')
          text = path.read_text()

          old = '''    window.localStorage.removeItem(LOCAL_DRAFT_KEY);\n    setShowForm(false);\n    await loadChallenges(data.id);'''
          new = '''    window.localStorage.removeItem(LOCAL_DRAFT_KEY);\n    setName(\"\");\n    setRegistrationType(\"NORMAL\");\n    setGoalMode(\"DISTANCE_KM\");\n    setFixedTargetKm(\"1000\");\n    setReferenceMonth(now.getMonth() + 1);\n    setReferenceYear(now.getFullYear());\n    setStartsAt(\"\");\n    setEndsAt(\"\");\n    setStartWindowOpen(\"\");\n    setStartWindowClose(\"\");\n    setShowForm(false);\n    await loadChallenges(data.id);'''
          if old not in text:
              raise SystemExit('createChallenge reset anchor not found')
          text = text.replace(old, new, 1)

          old = '''        internal_name: `${selected.code}-${offers.length + 1}`,\n        public_name: `${selected.public_name} · ${offers.length + 1}`,'''
          new = '''        internal_name: `${selected.code}-${offers.length + 1}`.slice(0, 120),\n        public_name: `${selected.public_name} · ${offers.length + 1}`.slice(0, 120),'''
          if old not in text:
              raise SystemExit('offer names anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Install dependencies
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Format
        working-directory: platform
        run: pnpm exec prettier --write apps/admin-web/src/ChallengesPanel.tsx
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/ChallengesPanel.tsx
          git commit -m "fix(admin): address challenge flow review feedback"
          git push
