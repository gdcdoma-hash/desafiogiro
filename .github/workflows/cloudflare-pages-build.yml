name: Testar pacote Cloudflare Pages sem publicar
on:
  pull_request:
    paths:
      - 'landing/**'
      - 'bridge/**'
      - 'index.html'
      - 'mudanca-de-endereco.html'
      - 'logo-desafio-giro.png'
      - 'flyer-outubro-rosa-home.jpg'
      - 'scripts/build-cloudflare-pages.mjs'
      - 'tests/**'
      - '.github/workflows/cloudflare-pages-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do empacotador e motor público
        run: |
          node --check scripts/build-cloudflare-pages.mjs
          node --check landing/campanha.js
          node --check landing/modelos.js
      - name: Testar pacote, roteamento e regras da landing
        run: node --test tests/*.test.cjs
      - name: Diagnóstico somente-leitura da API pública (não bloqueante)
        run: node scripts/probe-landing-api.mjs
      - name: Conferir tamanho da saída
        run: du -sh dist-cloudflare-pages
