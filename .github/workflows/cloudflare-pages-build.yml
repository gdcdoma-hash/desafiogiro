name: Testar pacote Cloudflare Pages sem publicar
on:
  pull_request:
    paths:
      - 'landing/**'
      - 'index.html'
      - 'mudanca-de-endereco.html'
      - 'logo-desafio-giro.png'
      - 'flyer-outubro-rosa-home.jpg'
      - 'scripts/build-cloudflare-pages.mjs'
      - 'tests/cloudflare-pages-build.test.cjs'
      - '.github/workflows/cloudflare-pages-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do empacotador
        run: node --check scripts/build-cloudflare-pages.mjs
      - name: Testar pacote e roteamento
        run: node --test tests/cloudflare-pages-build.test.cjs
      - name: Conferir tamanho da saída
        run: du -sh dist-cloudflare-pages
