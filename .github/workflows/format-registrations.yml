name: Format registrations panel

on:
  push:
    branches:
      - feature/registrations-domain-cycle-1
    paths:
      - platform/apps/admin-web/src/RegistrationsPanel.tsx
      - .github/workflows/format-registrations.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/registrations-domain-cycle-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Format panel
        working-directory: platform
        run: pnpm exec prettier --write apps/admin-web/src/RegistrationsPanel.tsx
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/RegistrationsPanel.tsx
          git diff --cached --quiet || git commit -m "style: formata painel de inscrições"
          git push origin HEAD:feature/registrations-domain-cycle-1
