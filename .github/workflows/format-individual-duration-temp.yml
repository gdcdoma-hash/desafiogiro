name: Apply individual duration UI temp

on:
  push:
    branches:
      - feature/individual-duration-periods-v1
    paths:
      - '.github/workflows/format-individual-duration-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/individual-duration-periods-v1
      - name: Apply focused UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing block: {label}")
              return text.replace(old, new, 1)

          p = Path('platform/apps/admin-web/src/ChallengesPanel.tsx')
          s = p.read_text()
          s = replace_once(s,
          '''  fixed_target_km: number | null;\n  status:''',
          '''  fixed_target_km: number | null;\n  participant_start_opens_on: string | null;\n  participant_start_closes_on: string | null;\n  status:''', 'challenge type')
          s = replace_once(s,
          '''  const [startsAt, setStartsAt] = useState(\"\");\n  const [endsAt, setEndsAt] = useState(\"\");''',
          '''  const [startsAt, setStartsAt] = useState(\"\");\n  const [endsAt, setEndsAt] = useState(\"\");\n  const [startWindowOpen, setStartWindowOpen] = useState(\"\");\n  const [startWindowClose, setStartWindowClose] = useState(\"\");''', 'admin state')
          s = replace_once(s,
          '''        \"id,code,public_name,medal_image_path,reference_year,reference_month,sports_starts_at,sports_ends_at,registration_type,goal_mode,fixed_target_km,status,is_public\",''',
          '''        \"id,code,public_name,medal_image_path,reference_year,reference_month,sports_starts_at,sports_ends_at,registration_type,goal_mode,fixed_target_km,participant_start_opens_on,participant_start_closes_on,status,is_public\",''', 'challenge select')
          s = replace_once(s,
          '''    if (!startsAt || !endsAt || new Date(endsAt) <= new Date(startsAt)) {\n      setMessage(\"Confira o início e o fim do período esportivo.\");\n      return;\n    }\n    const fixedKm = goalMode === \"DURATION_DAYS\" ? Number(fixedTargetKm) : null;''',
          '''    if (\n      goalMode === \"DISTANCE_KM\" &&\n      (!startsAt || !endsAt || new Date(endsAt) <= new Date(startsAt))\n    ) {\n      setMessage(\"Confira o início e o fim do período esportivo.\");\n      return;\n    }\n    if (\n      goalMode === \"DURATION_DAYS\" &&\n      (!startWindowOpen || !startWindowClose || startWindowClose < startWindowOpen)\n    ) {\n      setMessage(\"Confira o primeiro e o último dia permitidos para iniciar.\");\n      return;\n    }\n    const fixedKm = goalMode === \"DURATION_DAYS\" ? Number(fixedTargetKm) : null;''', 'create validation')
          s = replace_once(s,
          '''        sports_starts_at: toIsoLocal(startsAt),\n        sports_ends_at: toIsoLocal(endsAt),\n        timezone: \"America/Fortaleza\",\n        registration_type: registrationType,\n        goal_mode: goalMode,\n        fixed_target_km: fixedKm,''',
          '''        sports_starts_at:\n          goalMode === \"DISTANCE_KM\"\n            ? toIsoLocal(startsAt)\n            : toIsoLocal(`${startWindowOpen}T00:00`),\n        sports_ends_at:\n          goalMode === \"DISTANCE_KM\"\n            ? toIsoLocal(endsAt)\n            : toIsoLocal(`${startWindowClose}T23:59`),\n        timezone: \"America/Fortaleza\",\n        registration_type: registrationType,\n        goal_mode: goalMode,\n        fixed_target_km: fixedKm,\n        participant_start_opens_on:\n          goalMode === \"DURATION_DAYS\" ? startWindowOpen : null,\n        participant_start_closes_on:\n          goalMode === \"DURATION_DAYS\" ? startWindowClose : null,''', 'challenge insert')
          s = replace_once(s,
          '''    setStartsAt(\"\");\n    setEndsAt(\"\");\n    setShowForm(false);''',
          '''    setStartsAt(\"\");\n    setEndsAt(\"\");\n    setStartWindowOpen(\"\");\n    setStartWindowClose(\"\");\n    setShowForm(false);''', 'reset')
          s = replace_once(s,
          '''                onChange={(event) =>\n                  setGoalMode(\n                    event.target.value as \"DISTANCE_KM\" | \"DURATION_DAYS\",\n                  )\n                }''',
          '''                onChange={(event) => {\n                  const nextMode = event.target.value as\n                    | \"DISTANCE_KM\"\n                    | \"DURATION_DAYS\";\n                  setGoalMode(nextMode);\n                  if (nextMode === \"DURATION_DAYS\" && !startWindowOpen) {\n                    const first = `${referenceYear}-${String(referenceMonth).padStart(2, \"0\")}-01`;\n                    const lastDay = new Date(\n                      referenceYear,\n                      referenceMonth,\n                      0,\n                    ).getDate();\n                    setStartWindowOpen(first);\n                    setStartWindowClose(\n                      `${referenceYear}-${String(referenceMonth).padStart(2, \"0\")}-${String(lastDay).padStart(2, \"0\")}`,\n                    );\n                  }\n                }}''', 'mode onchange')
          old_period = '''          <div className=\"form-grid two\">\n            <label>\n              Início do período esportivo\n              <input\n                type=\"datetime-local\"\n                value={startsAt}\n                onChange={(event) => setStartsAt(event.target.value)}\n                required\n              />\n            </label>\n            <label>\n              Fim do período esportivo\n              <input\n                type=\"datetime-local\"\n                value={endsAt}\n                onChange={(event) => setEndsAt(event.target.value)}\n                required\n              />\n            </label>\n          </div>\n          {goalMode === \"DURATION_DAYS\" ? (\n            <p className=\"mini-description\">\n              O início e o término previstos de cada participante serão\n              calculados conforme o prazo escolhido quando a inscrição for\n              confirmada.\n            </p>\n          ) : null}'''
          new_period = '''          {goalMode === \"DISTANCE_KM\" ? (\n            <div className=\"form-grid two\">\n              <label>\n                Início do desafio\n                <input\n                  type=\"datetime-local\"\n                  value={startsAt}\n                  onChange={(event) => setStartsAt(event.target.value)}\n                  required\n                />\n              </label>\n              <label>\n                Fim do desafio\n                <input\n                  type=\"datetime-local\"\n                  value={endsAt}\n                  onChange={(event) => setEndsAt(event.target.value)}\n                  required\n                />\n              </label>\n            </div>\n          ) : (\n            <>\n              <div className=\"form-grid two\">\n                <label>\n                  Primeiro dia permitido para iniciar\n                  <input\n                    type=\"date\"\n                    value={startWindowOpen}\n                    onChange={(event) => setStartWindowOpen(event.target.value)}\n                    required\n                  />\n                </label>\n                <label>\n                  Último dia permitido para iniciar\n                  <input\n                    type=\"date\"\n                    min={startWindowOpen || undefined}\n                    value={startWindowClose}\n                    onChange={(event) => setStartWindowClose(event.target.value)}\n                    required\n                  />\n                </label>\n              </div>\n              <p className=\"mini-description\">\n                Cada participante terá seu próprio período. Quem se inscrever\n                antes pode escolher uma data futura dentro desta janela; quem\n                entrar durante o mês começa, no mínimo, na data da inscrição.\n                O término será calculado pelo prazo escolhido.\n              </p>\n            </>\n          )}'''
          s = replace_once(s, old_period, new_period, 'period fields')
          s = replace_once(s,
          '''              <span>\n                {formatDate(item.sports_starts_at)} a{\" \"}\n                {formatDate(item.sports_ends_at)}\n              </span>''',
          '''              <span>\n                {item.goal_mode === \"DURATION_DAYS\" &&\n                item.participant_start_opens_on &&\n                item.participant_start_closes_on\n                  ? `Inícios permitidos: ${formatDate(item.participant_start_opens_on + \"T12:00:00\")} a ${formatDate(item.participant_start_closes_on + \"T12:00:00\")}`\n                  : `${formatDate(item.sports_starts_at)} a ${formatDate(item.sports_ends_at)}`}\n              </span>''', 'list period')
          p.write_text(s)

          p = Path('platform/apps/admin-web/src/ParticipantRegistrationCreate.tsx')
          s = p.read_text()
          s = replace_once(s,
          '''  category_used: number;\n};''',
          '''  category_used: number;\n  goal_mode: \"DISTANCE_KM\" | \"DURATION_DAYS\";\n  duration_days: number | null;\n  participant_start_opens_on: string | null;\n  participant_start_closes_on: string | null;\n};''', 'catalog type')
          s = replace_once(s,
          '''  reservation_status: string | null;\n};''',
          '''  reservation_status: string | null;\n  goal_mode: \"DISTANCE_KM\" | \"DURATION_DAYS\";\n  duration_days: number | null;\n  planned_starts_at: string | null;\n  planned_ends_at: string | null;\n  participant_start_opens_on: string | null;\n  participant_start_closes_on: string | null;\n};''', 'checkout type')
          s = replace_once(s,
          '''function categoryLabel(categoryCode: string) {''',
          '''function localDateInput(value = new Date()) {\n  const year = value.getFullYear();\n  const month = String(value.getMonth() + 1).padStart(2, \"0\");\n  const day = String(value.getDate()).padStart(2, \"0\");\n  return `${year}-${month}-${day}`;\n}\n\nfunction maxDate(a: string, b: string) {\n  return a > b ? a : b;\n}\n\nfunction displayPeriodEnd(value: string | null) {\n  if (!value) return \"\";\n  const date = new Date(value);\n  date.setDate(date.getDate() - 1);\n  return new Intl.DateTimeFormat(\"pt-BR\").format(date);\n}\n\nfunction displayPeriodStart(value: string | null) {\n  return value\n    ? new Intl.DateTimeFormat(\"pt-BR\").format(new Date(value))\n    : \"\";\n}\n\nfunction categoryLabel(categoryCode: string) {''', 'date helpers')
          s = replace_once(s,
          '''  const [editGoalId, setEditGoalId] = useState(\"\");''',
          '''  const [editGoalId, setEditGoalId] = useState(\"\");\n  const [startOn, setStartOn] = useState(\"\");\n  const [editStartOn, setEditStartOn] = useState(\"\");''', 'date states')
          s = replace_once(s,
          '''      | \"add_participant_checkout_item\"\n      | \"remove_participant_checkout_item\"\n      | \"swap_participant_checkout_item\",\n    args: Record<string, string>,''',
          '''      | \"add_participant_checkout_item_scheduled\"\n      | \"remove_participant_checkout_item\"\n      | \"swap_participant_checkout_item_scheduled\",\n    args: Record<string, string | null>,''', 'rpc union')
          s = replace_once(s,
          '''  const editGoals = useMemo(\n    () => catalog.filter((item) => item.offer_id === editOfferId),\n    [catalog, editOfferId],\n  );''',
          '''  useEffect(() => {\n    if (selected?.goal_mode === \"DURATION_DAYS\") {\n      setStartOn(\n        maxDate(\n          localDateInput(),\n          selected.participant_start_opens_on ?? localDateInput(),\n        ),\n      );\n    } else {\n      setStartOn(\"\");\n    }\n  }, [selected?.goal_id]);\n\n  const editGoals = useMemo(\n    () => catalog.filter((item) => item.offer_id === editOfferId),\n    [catalog, editOfferId],\n  );\n  const editSelected = catalog.find(\n    (item) => item.offer_id === editOfferId && item.goal_id === editGoalId,\n  );''', 'selected date effect')
          s = replace_once(s,
          '''    setEditGoalId(sameGoal?.goal_id ?? first?.goal_id ?? item.goal_id);''',
          '''    setEditGoalId(sameGoal?.goal_id ?? first?.goal_id ?? item.goal_id);\n    setEditStartOn(\n      item.goal_mode === \"DURATION_DAYS\" && item.planned_starts_at\n        ? localDateInput(new Date(item.planned_starts_at))\n        : \"\",\n    );''', 'begin edit date')
          s = replace_once(s,
          '''      \"add_participant_checkout_item\",\n      {\n        target_checkout_id: checkout.checkout_id,\n        target_offer_id: selected.offer_id,\n        target_goal_id: selected.goal_id,\n      },''',
          '''      \"add_participant_checkout_item_scheduled\",\n      {\n        target_checkout_id: checkout.checkout_id,\n        target_offer_id: selected.offer_id,\n        target_goal_id: selected.goal_id,\n        target_start_on:\n          selected.goal_mode === \"DURATION_DAYS\" ? startOn : null,\n      },''', 'add scheduled')
          s = replace_once(s,
          '''      \"swap_participant_checkout_item\",\n      {\n        target_checkout_id: checkout.checkout_id,\n        target_registration_id: item.registration_id,\n        target_offer_id: editOfferId,\n        target_goal_id: editGoalId,\n      },''',
          '''      \"swap_participant_checkout_item_scheduled\",\n      {\n        target_checkout_id: checkout.checkout_id,\n        target_registration_id: item.registration_id,\n        target_offer_id: editOfferId,\n        target_goal_id: editGoalId,\n        target_start_on:\n          editSelected?.goal_mode === \"DURATION_DAYS\" ? editStartOn : null,\n      },''', 'swap scheduled')
          s = replace_once(s,
          '''                {item.reservation_status === \"RESERVED\" ? (''',
          '''                {item.goal_mode === \"DURATION_DAYS\" ? (\n                  <small>\n                    Período: {displayPeriodStart(item.planned_starts_at)} a{\" \"}\n                    {displayPeriodEnd(item.planned_ends_at)}\n                  </small>\n                ) : null}\n                {item.reservation_status === \"RESERVED\" ? (''', 'cart period')
          s = replace_once(s,
          '''                        setEditOfferId(nextOffer);\n                        setEditGoalId(firstGoal?.goal_id ?? \"\");''',
          '''                        setEditOfferId(nextOffer);\n                        setEditGoalId(firstGoal?.goal_id ?? \"\");\n                        setEditStartOn(\n                          firstGoal?.goal_mode === \"DURATION_DAYS\"\n                            ? maxDate(\n                                localDateInput(),\n                                firstGoal.participant_start_opens_on ??\n                                  localDateInput(),\n                              )\n                            : \"\",\n                        );''', 'edit offer date')
          s = replace_once(s,
          '''                      onChange={(event) => setEditGoalId(event.target.value)}''',
          '''                      onChange={(event) => {\n                        const nextGoalId = event.target.value;\n                        const nextGoal = catalog.find(\n                          (row) =>\n                            row.offer_id === editOfferId &&\n                            row.goal_id === nextGoalId,\n                        );\n                        setEditGoalId(nextGoalId);\n                        if (nextGoal?.goal_mode === \"DURATION_DAYS\") {\n                          setEditStartOn(\n                            maxDate(\n                              localDateInput(),\n                              nextGoal.participant_start_opens_on ??\n                                localDateInput(),\n                            ),\n                          );\n                        }\n                      }}''', 'edit goal date')
          s = replace_once(s,
          '''                  <div className=\"registration-edit-actions\">''',
          '''                  {editSelected?.goal_mode === \"DURATION_DAYS\" ? (\n                    <label>\n                      Data de início\n                      <input\n                        type=\"date\"\n                        min={maxDate(\n                          localDateInput(),\n                          editSelected.participant_start_opens_on ??\n                            localDateInput(),\n                        )}\n                        max={\n                          editSelected.participant_start_closes_on ?? undefined\n                        }\n                        value={editStartOn}\n                        onChange={(event) => setEditStartOn(event.target.value)}\n                        disabled={busy}\n                        required\n                      />\n                    </label>\n                  ) : null}\n                  <div className=\"registration-edit-actions\">''', 'edit date field')
          s = replace_once(s,
          '''          {selected ? (\n            <div className=\"registration-add-summary\">''',
          '''          {selected?.goal_mode === \"DURATION_DAYS\" ? (\n            <label>\n              Quando você quer começar?\n              <input\n                type=\"date\"\n                min={maxDate(\n                  localDateInput(),\n                  selected.participant_start_opens_on ?? localDateInput(),\n                )}\n                max={selected.participant_start_closes_on ?? undefined}\n                value={startOn}\n                onChange={(event) => setStartOn(event.target.value)}\n                disabled={busy}\n                required\n              />\n              <small>\n                Você escolhe o início. O sistema calcula automaticamente o fim\n                dos {selected.duration_days} dias.\n              </small>\n            </label>\n          ) : null}\n          {selected ? (\n            <div className=\"registration-add-summary\">''', 'add date field')
          p.write_text(s)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Format changed components
        working-directory: platform
        run: pnpm exec prettier --write apps/admin-web/src/ChallengesPanel.tsx apps/admin-web/src/ParticipantRegistrationCreate.tsx
      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/ChallengesPanel.tsx platform/apps/admin-web/src/ParticipantRegistrationCreate.tsx
          git commit -m "feat: configurar períodos individuais por prazo"
          git push origin HEAD:feature/individual-duration-periods-v1
