name: Format challenges temp

on:
  push:
    branches:
      - feature/challenges-domain-cycle-1
    paths:
      - 'platform/apps/admin-web/src/ChallengesPanel.tsx'
      - '.github/workflows/format-challenges-temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/challenges-domain-cycle-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin-web/src/ChallengesPanel.tsx
      - name: Commit formatting
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/ChallengesPanel.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: formata painel de desafios"
          git push origin HEAD:feature/challenges-domain-cycle-1
