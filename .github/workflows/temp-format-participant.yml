name: Temp format participant registration

on:
  push:
    branches:
      - feature/participant-registration-payment-media-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/participant-registration-payment-media-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: platform
      - run: pnpm exec prettier --write apps/admin-web/src/ParticipantRegistrationCreate.tsx
        working-directory: platform
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/ParticipantRegistrationCreate.tsx
          git commit -m "style: apply prettier to participant registration"
          git push origin HEAD:feature/participant-registration-payment-media-v1
