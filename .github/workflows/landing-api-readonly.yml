name: Verificar API publica Portal Giro (somente leitura)
# Consulta a producao apenas quando acionado por um operador autorizado.
# Mantida fora da CI obrigatoria porque o backend PROD ainda nao atende ao contrato.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar-api-publica:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do script de diagnostico
        run: node --check scripts/landing-api-smoke-readonly.cjs
      - name: Conferir API Apps Script PROD sem alterar inscricoes
        run: node scripts/landing-api-smoke-readonly.cjs
