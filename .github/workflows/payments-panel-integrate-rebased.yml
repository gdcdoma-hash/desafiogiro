name: Integrate payments panel rebased

on:
  push:
    branches: [feature/payments-admin-cycle-2-rebased]
    paths: [.github/workflows/payments-panel-integrate-rebased.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payments-admin-cycle-2-rebased
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Patch main
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('platform/apps/admin-web/src/main.tsx')
          s = p.read_text()
          s = s.replace('import { RegistrationsPanel } from "./RegistrationsPanel";\n', 'import { RegistrationsPanel } from "./RegistrationsPanel";\nimport { PaymentsPanel } from "./PaymentsPanel";\n')
          marker = '''        {context?.permissions.includes("audit.read") ? (\n'''
          block = '''        {context?.permissions.includes("payments.read") ? (\n          <PaymentsPanel\n            supabase={supabase}\n            canManage={context.permissions.includes("payments.manage")}\n          />\n        ) : null}\n\n'''
          if block not in s:
              s = s.replace(marker, block + marker)
          p.write_text(s)
          PY
      - name: Format
        working-directory: platform
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/admin-web/src/main.tsx apps/admin-web/src/PaymentsPanel.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/main.tsx platform/apps/admin-web/src/PaymentsPanel.tsx
          git diff --cached --quiet || git commit -m "feat: integra pagamentos ao painel administrativo"
          git push origin HEAD:feature/payments-admin-cycle-2-rebased
