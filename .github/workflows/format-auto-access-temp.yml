name: Format automatic access temp

on:
  push:
    branches:
      - feature/automatic-meu-giro-access-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automatic-meu-giro-access-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin-web/src/main.tsx apps/admin-web/src/ParticipantFirstAccess.tsx apps/admin-web/src/ParticipantsPanel.tsx apps/api/src/index.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin-web/src/main.tsx apps/admin-web/src/ParticipantFirstAccess.tsx apps/admin-web/src/ParticipantsPanel.tsx apps/api/src/index.ts
          git diff --cached --quiet || git commit -m "chore: aplicar prettier no acesso automático"
          git push origin HEAD:feature/automatic-meu-giro-access-v1
