name: Format payments UX

on:
  push:
    branches: [feature/payments-ux-cycle-4]
    paths: [.github/workflows/payments-ux-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payments-ux-cycle-4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Format files
        working-directory: platform
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/admin-web/src/PaymentsPanel.tsx apps/admin-web/src/payments-summary.css
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/PaymentsPanel.tsx platform/apps/admin-web/src/payments-summary.css
          git diff --cached --quiet || git commit -m "style: formata painel de pagamentos"
          git push origin HEAD:feature/payments-ux-cycle-4
