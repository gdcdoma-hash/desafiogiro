name: Format admin screen navigation temp

on:
  push:
    branches:
      - fix/admin-screen-navigation
    paths:
      - '.github/workflows/fix-admin-screen-navigation-temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-screen-navigation
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        working-directory: platform
        run: pnpm exec prettier --write apps/admin-web/src/main.tsx apps/admin-web/src/ChallengesPanel.tsx apps/admin-web/src/module-nav.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/main.tsx platform/apps/admin-web/src/ChallengesPanel.tsx platform/apps/admin-web/src/module-nav.css
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(admin): format screen navigation"
            git push
          fi
