name: Format inventory movements

on:
  push:
    branches: [feature/inventory-movements-cycle-3]
    paths: [.github/workflows/inventory-movements-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-movements-cycle-3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Format file
        working-directory: platform
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/admin-web/src/InventoryPanel.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/InventoryPanel.tsx
          git diff --cached --quiet || git commit -m "style: formata movimentações de estoque"
          git push origin HEAD:feature/inventory-movements-cycle-3
