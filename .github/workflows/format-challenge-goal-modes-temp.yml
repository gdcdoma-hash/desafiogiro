name: Format challenge goal modes temp

on:
  push:
    branches:
      - feature/challenge-goal-modes-v1
    paths:
      - 'platform/apps/admin-web/src/ChallengesPanel.tsx'
      - '.github/workflows/format-challenge-goal-modes-temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/challenge-goal-modes-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Format component
        working-directory: platform
        run: pnpm exec prettier --write apps/admin-web/src/ChallengesPanel.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/ChallengesPanel.tsx
          git commit -m "style: format challenge goal modes"
          git push origin HEAD:feature/challenge-goal-modes-v1
