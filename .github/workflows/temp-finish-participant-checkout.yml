name: Temp finish participant checkout

on:
  push:
    branches:
      - feature/participant-checkout-v1

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/participant-checkout-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - working-directory: platform
        run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('platform/apps/admin-web/src/main.tsx')
          s=p.read_text()
          old='''          <PaymentsPanel\n            supabase={supabase}\n            canManage={context.permissions.includes("payments.manage")}\n          />'''
          new='''          <PaymentsPanel\n            supabase={supabase}\n            canManage={context.permissions.includes("payments.manage")}\n            canManageRegistrations={context.permissions.includes(\n              "registrations.manage",\n            )}\n          />'''
          if old not in s:
              raise SystemExit('PaymentsPanel block not found')
          p.write_text(s.replace(old,new))
          PY
      - working-directory: platform
        run: pnpm exec prettier --write apps/admin-web/src/main.tsx apps/admin-web/src/PaymentsPanel.tsx apps/admin-web/src/ParticipantCheckoutAdminPanel.tsx apps/admin-web/src/ParticipantRegistrationConfigPanel.tsx
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src
          git commit -m "feat: wire checkout administration into payments panel"
          git push origin HEAD:feature/participant-checkout-v1
