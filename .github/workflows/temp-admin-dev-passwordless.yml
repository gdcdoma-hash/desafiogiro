name: Temp admin DEV passwordless

on:
  push:
    branches:
      - feature/admin-dev-passwordless-access

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dev-passwordless-access
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - working-directory: platform
        run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('platform/apps/admin-web/src/main.tsx')
          s = p.read_text()

          marker = '''  async function signOut() {'''
          fn = '''  async function requestAdminPasswordlessAccess(event: React.FormEvent) {\n    event.preventDefault();\n    if (!email) {\n      setMessage(\"Informe o e-mail administrativo.\");\n      return;\n    }\n    setBusy(true);\n    setMessage(\"Enviando acesso administrativo sem senha…\");\n    const { error } = await supabase.auth.signInWithOtp({\n      email,\n      options: {\n        shouldCreateUser: false,\n        emailRedirectTo: `${window.location.origin}/?area=admin`,\n      },\n    });\n    setMessage(\n      error\n        ? \"Não foi possível enviar o acesso agora. Tente novamente em instantes.\"\n        : \"Se este e-mail possuir permissão administrativa, enviaremos um link de acesso. Abra o link neste navegador.\",\n    );\n    setBusy(false);\n  }\n\n'''
          if 'requestAdminPasswordlessAccess' not in s:
              if marker not in s:
                  raise SystemExit('signOut marker not found')
              s = s.replace(marker, fn + marker, 1)

          old = '''          <p>Acesso restrito aos integrantes autorizados da equipe.</p>\n          <form onSubmit={signIn}>\n            <label>\n              E-mail\n              <input\n                type=\"email\"\n                autoComplete=\"username\"\n                value={email}\n                onChange={(event) => setEmail(event.target.value)}\n                required\n              />\n            </label>\n            <label>\n              Senha\n              <input\n                type=\"password\"\n                autoComplete=\"current-password\"\n                value={password}\n                onChange={(event) => setPassword(event.target.value)}\n                required\n              />\n            </label>\n            <button type=\"submit\" disabled={busy}>\n              {busy ? \"Entrando…\" : \"Entrar\"}\n            </button>\n          </form>\n          <button\n            type=\"button\"\n            className=\"link-button\"\n            onClick={() => void requestPasswordReset()}\n            disabled={busy}\n          >\n            Esqueci minha senha\n          </button>'''
          new = '''          {environment === \"preview\" ? (\n            <>\n              <div className=\"status-row\">\n                <span className=\"dot\" aria-hidden=\"true\" />\n                <span>Ambiente DEV — acesso administrativo de teste</span>\n              </div>\n              <p>\n                Durante os testes, o Admin usa acesso por e-mail, sem senha. A\n                sessão fica salva neste navegador depois do primeiro acesso.\n              </p>\n              <form onSubmit={requestAdminPasswordlessAccess}>\n                <label>\n                  E-mail administrativo\n                  <input\n                    type=\"email\"\n                    autoComplete=\"username\"\n                    value={email}\n                    onChange={(event) => setEmail(event.target.value)}\n                    required\n                  />\n                </label>\n                <button type=\"submit\" disabled={busy}>\n                  {busy ? \"Enviando…\" : \"Receber acesso ao Admin DEV\"}\n                </button>\n              </form>\n            </>\n          ) : (\n            <>\n              <p>Acesso restrito aos integrantes autorizados da equipe.</p>\n              <form onSubmit={signIn}>\n                <label>\n                  E-mail\n                  <input\n                    type=\"email\"\n                    autoComplete=\"username\"\n                    value={email}\n                    onChange={(event) => setEmail(event.target.value)}\n                    required\n                  />\n                </label>\n                <label>\n                  Senha\n                  <input\n                    type=\"password\"\n                    autoComplete=\"current-password\"\n                    value={password}\n                    onChange={(event) => setPassword(event.target.value)}\n                    required\n                  />\n                </label>\n                <button type=\"submit\" disabled={busy}>\n                  {busy ? \"Entrando…\" : \"Entrar\"}\n                </button>\n              </form>\n              <button\n                type=\"button\"\n                className=\"link-button\"\n                onClick={() => void requestPasswordReset()}\n                disabled={busy}\n              >\n                Esqueci minha senha\n              </button>\n            </>\n          )}'''
          if old not in s:
              raise SystemExit('admin login block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - working-directory: platform
        run: pnpm exec prettier --write apps/admin-web/src/main.tsx
      - run: |
          git rm .github/workflows/temp-admin-dev-passwordless.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/main.tsx
          git commit -m "feat: add passwordless admin access in DEV preview"
          git push origin HEAD:feature/admin-dev-passwordless-access
