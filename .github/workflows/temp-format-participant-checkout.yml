name: Temp format participant checkout

on:
  push:
    branches:
      - feature/participant-checkout-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/participant-checkout-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - working-directory: platform
        run: pnpm install --frozen-lockfile
      - working-directory: platform
        run: pnpm exec prettier --write apps/admin-web/src/ParticipantRegistrationCreate.tsx
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/ParticipantRegistrationCreate.tsx
          git commit -m "style: format participant checkout with prettier"
          git push origin HEAD:feature/participant-checkout-v1
