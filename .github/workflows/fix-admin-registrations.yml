name: Fix admin registrations panel

on:
  push:
    branches: [fix/admin-show-registrations]
    paths: [.github/workflows/fix-admin-registrations.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-show-registrations
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Patch main
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('platform/apps/admin-web/src/main.tsx')
          s = p.read_text()
          s = s.replace('import { ParticipantsPanel } from "./ParticipantsPanel";\n', 'import { ParticipantsPanel } from "./ParticipantsPanel";\nimport { RegistrationsPanel } from "./RegistrationsPanel";\n')
          marker = '''        {context?.permissions.includes("audit.read") ? (\n'''
          block = '''        {context?.permissions.includes("registrations.read") ? (\n          <RegistrationsPanel\n            supabase={supabase}\n            canManage={context.permissions.includes("registrations.manage")}\n          />\n        ) : null}\n\n'''
          if block not in s:
              s = s.replace(marker, block + marker)
          p.write_text(s)
          PY
      - name: Format
        working-directory: platform
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/admin-web/src/main.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/admin-web/src/main.tsx
          git diff --cached --quiet || git commit -m "fix: exibe inscrições no painel administrativo"
          git push origin HEAD:fix/admin-show-registrations
